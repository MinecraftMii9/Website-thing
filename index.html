<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><!-- NOM DE VOTRE BOUTIQUE ICI --></title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --text-dark: #2d3436;
            --bg-light: #f8f9fa;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-light); 
            color: var(--text-dark);
            line-height: 1.6;
        }

        header { 
            background: linear-gradient(135deg, var(--primary-color), #1a252f); 
            color: white; 
            padding: 40px 20px; 
            text-align: center;
        }
        
        header h1 { font-size: 2.5rem; margin-bottom: 8px; }
        header p { font-size: 1.1rem; opacity: 0.8; font-weight: 300; }

        nav { 
            background-color: white; 
            padding: 0; 
            text-align: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        nav a { 
            display: inline-block;
            color: var(--primary-color); 
            padding: 15px 25px;
            text-decoration: none; 
            font-weight: 600; 
            transition: var(--transition);
            border-bottom: 3px solid transparent;
        }
        
        nav a:hover { 
            color: var(--accent-color); 
            border-bottom-color: var(--accent-color);
        }

        .container { 
            max-width: 1100px; 
            margin: 40px auto; 
            padding: 0 20px; 
        }

        section {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 40px;
        }

        section h2 {
            font-size: 1.75rem;
            color: var(--primary-color);
            margin-bottom: 25px;
        }

        .intro-box { 
            font-size: 1.15rem; 
            color: #555; 
            border-left: 4px solid var(--accent-color);
            padding-left: 20px;
        }

        /* Responsive Product Grid */
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; 
        }

        .product-card { 
            background: white;
            border: 1px solid #eef2f3; 
            padding: 20px; 
            border-radius: 10px; 
            text-align: center; 
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            height: 480px; /* Locked box size for layout consistency */
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .product-image-placeholder {
            width: 100%;
            height: 140px;
            background-color: #eaeff2;
            border-radius: 6px;
            margin-bottom: 15px;
            /* Insert your <img src="..."> tag here inside your cards */
        }

        .product-card h3 { color: var(--primary-color); margin-bottom: 10px; }

        /* Scrollable Description Container Panel */
        .scrollable-description-panel {
            flex-grow: 1;
            overflow-y: auto; /* Activates vertical scroll bar when content overflows */
            padding: 10px;
            margin-bottom: 15px;
            background-color: #fafbfc;
            border: 1px dashed #d1d8e0;
            border-radius: 6px;
            text-align: left;
            font-size: 0.9rem;
            color: #555;
            max-height: 120px; /* Limits size to guarantee interactive scrolling layout */
        }

        /* Custom scrollbar adjustments */
        .scrollable-description-panel::-webkit-scrollbar { width: 6px; }
        .scrollable-description-panel::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }

        .product-card .colors { font-size: 0.85rem; font-weight: bold; color: #7f8c8d; margin-bottom: 10px; }
        .product-card .price { color: #e74c3c; font-weight: 700; font-size: 1.3rem; margin-top: auto; }

        /* Interactive Tools Interface Layout */
        .interactive-tool { 
            background: linear-gradient(to right, #f9fbfd, #f2f6fa);
            border: 1px solid #e4eaf0;
        }

        .tool-ui-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        /* Footer Layout Structure */
        footer { 
            background-color: var(--primary-color); 
            color: #bdc3c7; 
            text-align: center; 
            padding: 30px 20px; 
            margin-top: 60px;
            border-top: 4px solid var(--accent-color);
        }
        
        footer p { margin-bottom: 8px; }
    </style>
</head>
