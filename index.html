<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><!-- Add Store Title Here --></title>
    <style>
        :root {
            --navy-primary: #2c3e50;
            --blue-accent: #3498db;
            --charcoal-text: #2d3436;
            --light-bg: #f8f9fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--light-bg); color: var(--charcoal-text); line-height: 1.6; }
        
        header { background: var(--navy-primary); color: white; padding: 30px; text-align: center; }
        
        /* Navigation Tabs Interface */
        nav { background: white; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        nav a { display: inline-block; color: var(--navy-primary); padding: 15px 20px; text-decoration: none; font-weight: bold; }
        
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        section { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); margin-bottom: 30px; }
        h2 { color: var(--navy-primary); margin-bottom: 20px; padding-bottom: 5px; border-bottom: 2px solid var(--blue-accent); }
        
        /* 3-Line Intro formatting */
        .intro-text { font-size: 1.1rem; line-height: 1.8; color: #444; }

        /* 5-6 Grid Layout */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { border: 1px solid #eef2f3; padding: 20px; border-radius: 8px; text-align: center; background: #fff; }
        
        /* Scrollable Description Window */
        .scroll-window { 
            height: 130px; 
            overflow-y: auto; 
            margin: 15px 0; 
            padding: 10px; 
            background: #fdfdfd; 
            border: 1px dashed #cbd5e1; 
            text-align: left;
            font-size: 0.95rem;
        }
        
        .item-price { color: #e74c3c; font-weight: bold; font-size: 1.25rem; margin-top: 10px; }
        
        /* Tools Layout Wrapper */
        .tool-box { background: #f1f5f9; padding: 20px; border-radius: 6px; border: 1px solid #e2e8f0; }

        /* Footer line constraints */
        footer { background: var(--navy-primary); color: #e2e8f0; text-align: center; padding: 25px; margin-top: 50px; font-size: 1rem; }
        footer p { margin: 4px 0; }
    </style>
</head>
